    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='static_dashboard_2/assets/css/bootstrap.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='static_dashboard_2/assets/vendors/css/vendors.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='static_dashboard_2/assets/vendors/css/select2.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='static_dashboard_2/assets/vendors/css/select2-theme.min.css') }}">

    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', filename='css/hris-global.css') }}">
</head>

<body>
    <!-- Header Start -->
    {% include 'partials/header.html' %}
    <!-- Header End -->

    <!-- Sidebar Start -->
    {% include 'partials/nav_dashboard3.html' %}
    <!-- Sidebar End -->

    <!-- Main Start -->
    <main class="nxl-container">
        {% block content %}
        {% endblock %}
    </main>
    <!-- Main End -->

    <script src="{{ url_for('static', filename='static_dashboard_3/assets/vendors/js/vendors.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/vendors/js/daterangepicker.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/vendors/js/apexcharts.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/vendors/js/circle-progress.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/js/common-init.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/js/dashboard-init.min.js') }}"></script>
    <script src="{{ url_for('static', filename='static_dashboard_3/assets/js/theme-customizer-init.min.js') }}"></script>
    {% block script %}
    {% endblock %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const signOutBtn = document.getElementById('headerSignOutBtn');
            if (signOutBtn) {
                signOutBtn.addEventListener('click', async function () {
                    try {
                        await fetch('/api/logout', { method: 'POST' });
                    } catch (err) {
                        console.error('Gagal logout:', err);
                    } finally {
                        window.location.href = "{{ url_for('main.index') }}";
                    }
                });
            }
        });
    </script>
</body>

</html>
