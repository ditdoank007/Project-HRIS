<!-- pages/dashboard_2/Master_Data_Tim_Siaga.html -->
{% extends "layout/baseDashboard2.html" %}

{% block title %}- Tim Siaga{% endblock %}

{% block content %}
<div class="nxl-content">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Master Data</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_master_data_tim_siaga') }}">Tim Siaga</a></li>
            </ul>
        </div>
    </div>

    <div class="main-content master-siaga">
        <div class="container-fluid">
            <!-- Card Utama: Data Tim -->
            <div class="card mb-4 filter-card">
                <div class="card-header-custom d-flex justify-content-between align-items-center">
                    <h6 class="mb-0"><i class="bi bi-people me-2"></i> Master Data Siaga</h6>
                    <div class="header-icons-wrapper d-flex gap-3">
                        <a href="{{ url_for('main.view_cari_data_tim_siaga') }}" class="btn p-0 border-0 bg-transparent shadow-none text-decoration-none" title="Cari">
                            <i class="bi bi-search" style="color: #333; font-size: 1.1rem;"></i>
                        </a>
                        <button class="btn p-0 border-0 bg-transparent shadow-none" id="btnNew" title="Baru">
                            <i class="bi bi-file-earmark-plus" style="color: #0d6efd; font-size: 1.2rem;"></i>
                        </button>
                        <button class="btn p-0 border-0 bg-transparent shadow-none" id="btnDelete" title="Hapus">
                            <i class="bi bi-trash" style="color: #dc3545; font-size: 1.2rem;"></i>
                        </button>
                    </div>
                </div>

                <div class="card-body">
                    <input type="hidden" id="guidTim">
                    <input type="hidden" id="isNew" value="true">
                    
                    <div class="row g-3">
                        <!-- Periode -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Periode</label>
                            <div class="col-md-9">
                                <div class="input-group input-group-sm" style="max-width: 200px;">
                                    <input type="month" id="periode" class="form-control-sm border w-100 px-2">
                                </div>
                            </div>
                        </div>

                        <!-- Shift -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Shift</label>
                            <div class="col-md-9">
                                <select id="cmbShift" class="form-select-sm border w-100" style="max-width: 200px;">
                                    <option value="">Pilih Shift</option>
                                    <option value="1">Shift 1</option>
                                    <option value="2">Shift 2</option>
                                </select>
                            </div>
                        </div>

                        <!-- Fungsional -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Fungsional</label>
                            <div class="col-md-9">
                                <select id="cmbFungsional" class="form-select-sm border w-100" style="max-width: 200px;">
                                    <option value="">Pilih Fungsional</option>
                                    <option value="Kom">Kom</option>
                                    <option value="Medis">Medis</option>
                                    <option value="KGR">KGR</option>
                                    <option value="PW">PW</option>
                                </select>
                            </div>
                        </div>

                        <!-- No Urut -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">No Urut</label>
                            <div class="col-md-9">
                                <input type="number" id="noUrut" class="form-control-sm border w-100" style="max-width: 200px;" value="0">
                            </div>
                        </div>

                        <!-- Nama TIM -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Nama TIM</label>
                            <div class="col-md-9">
                                <input type="text" id="namaTim" class="form-control-sm border w-100" style="max-width: 300px;" placeholder="Nama TIM...">
                            </div>
                        </div>

                        <!-- Unit Kerja -->
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Unit Kerja</label>
                            <div class="col-md-9">
                                <select id="cmbUnit" class="form-select-sm border w-100" style="max-width: 300px;">
                                    <option value="">Pilih Unit Kerja</option>
                                    {% for unit in unit_kerja_list %}
                                    <option value="{{ unit.UNIT_KERJA_ID }}">{{ unit.NAMA_UNIT_KERJA }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Update info -->
                        <div class="row align-items-center mb-3">
                            <div class="col-md-2"></div>
                            <div class="col-md-9">
                                <small id="lblUpdate" class="text-muted"></small>
                            </div>
                        </div>

                        <!-- Tabel Anggota -->
                        <div class="row">
                            <div class="col-md-2"></div>
                            <div class="col-md-9">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-sm w-100">
                                        <thead class="table-light">
                                            <tr>
                                                <th style="width:40%">NIP</th>
                                                <th>Nama</th>
                                                <th style="width:50px;">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tbodyAnggota">
                                            <tr>
                                                <td colspan="3" class="text-center py-4 text-muted">No records to display.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- ✅ TOMBOL SIMPAN BARU -->
                        <div class="col-12 d-flex justify-content-center mt-3">
                            <button type="button" id="btnSave" class="btn btn-orange-figma px-4">
                                <i class="bi bi-save me-1"></i>Simpan
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card: Add Anggota -->
            <div class="card mb-4 filter-card">
                <div class="card-header-customm">
                    <h6 class="mb-0">Add Anggota TIM</h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Pegawai</label>
                            <div class="col-md-7 position-relative">
                                <input type="text" id="searchPegawai" class="form-control-sm border w-100" placeholder="Cari pegawai..." autocomplete="off">
                                <div id="searchResults" class="list-group position-absolute shadow-sm" style="z-index:1000; display:none; max-height:200px; overflow-y:auto; width:100%;"></div>
                            </div>
                        </div>
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">Peg. lintas TIM</label>
                            <div class="col-md-7">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="lintasTim">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-2"></div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100 py-2" id="btnInsertAnggota">
                                    <i class="bi bi-plus-circle me-2"></i> Insert Pegawai to table
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card: Save As -->
            <div class="card mb-4 filter-card">
                <div class="card-header-customm">
                    <h6 class="mb-0">Save As Tim Siaga</h6>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="row align-items-center mb-3">
                            <label class="col-md-2 form-label-custom mb-1 mb-md-0">ke Periode</label>
                            <div class="col-md-7">
                                <div class="input-group input-group-sm" style="max-width: 200px;">
                                    <input type="month" id="periodeTujuan" class="form-control-sm border w-100 px-2">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-2"></div>
                            <div class="col-md-3">
                                <button class="btn btn-primary w-100 py-2" id="btnSaveAs">
                                    <i class="bi bi-save me-2"></i> Save
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-label-custom { font-size: 0.85rem; font-weight: 600; color: #333; min-width: 120px; }
    .card-header-customm { background-color: #e66b30; color: white; padding: 8px 15px; border-radius: 10px 10px 0 0; }
    .btn-orange-figma {
        background-color: #E29526;
        color: white;
        border: none;
        font-weight: 600;
        padding: 8px 30px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
    }
    .btn-orange-figma:hover { background-color: #c97e1e; }
    .btn-orange-figma:disabled { background-color: #ccc; cursor: not-allowed; }
</style>
{% endblock %}

{% block script %}
<script>
    let anggotaTable = [];
    let currentGuid = '';
    
    document.getElementById('periode').value = new Date().toISOString().slice(0, 7);
    
    // ===================== SEARCH PEGAWAI =====================
    let searchTimeout;
    const searchInput = document.getElementById('searchPegawai');
    const searchResults = document.getElementById('searchResults');
    
    searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const kw = this.value.trim();
        
        console.log('🔍 Mencari pegawai:', kw);
        
        if (kw.length < 1) { 
            searchResults.style.display = 'none'; 
            return; 
        }
        
        searchTimeout = setTimeout(() => {
            fetch(`/api/tim-siaga/search-pegawai?keyword=${encodeURIComponent(kw)}`)
                .then(res => res.json())
                .then(result => {
                    console.log('📋 Hasil search:', result);
                    
                    if (result.data && result.data.length > 0) {
                        let html = '';
                        result.data.forEach(p => {
                            html += `
                                <a href="#" class="list-group-item list-group-item-action py-2 px-3" 
                                   onclick="event.preventDefault(); addAnggota('${p.nip}', '${p.nama}')"
                                   style="cursor: pointer;">
                                    <strong>${p.nama}</strong><br>
                                    <small class="text-muted">${p.nip}</small>
                                </a>`;
                        });
                        searchResults.innerHTML = html;
                        searchResults.style.display = 'block';
                    } else {
                        searchResults.innerHTML = '<div class="list-group-item py-2 px-3 text-muted small">Tidak ditemukan</div>';
                        searchResults.style.display = 'block';
                    }
                })
                .catch(err => {
                    console.error('❌ Error search:', err);
                });
        }, 300);
    });
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#searchPegawai') && !e.target.closest('#searchResults')) {
            searchResults.style.display = 'none';
        }
    });
    
    function addAnggota(nip, nama) {
        console.log('✅ Menambahkan anggota:', nip, nama);
        
        if (anggotaTable.find(a => a.nip === nip)) {
            alert('Pegawai sudah ada di tabel!');
            return;
        }
        
        anggotaTable.push({nip: nip, nama: nama});
        renderAnggota();
        
        searchResults.style.display = 'none';
        searchInput.value = '';
        searchInput.focus();
        
        console.log('📋 Anggota table sekarang:', anggotaTable);
    }
    
    function renderAnggota() {
        const tbody = document.getElementById('tbodyAnggota');
        if (anggotaTable.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-muted">No records to display.</td></tr>';
            return;
        }
        tbody.innerHTML = anggotaTable.map((a, i) => `
            <tr>
                <td>${a.nip}</td>
                <td>${a.nama}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="hapusAnggota(${i})" title="Hapus">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }
    
    function hapusAnggota(index) {
        if (confirm('Hapus anggota ini?')) {
            anggotaTable.splice(index, 1);
            renderAnggota();
        }
    }
    
    // ===================== INSERT ANGGOTA VIA TOMBOL =====================
    document.getElementById('btnInsertAnggota').addEventListener('click', function() {
        const kw = searchInput.value.trim();
        if (kw.length < 1) { 
            alert('Ketik minimal 1 huruf nama pegawai, lalu pilih dari dropdown!'); 
            searchInput.focus();
            return; 
        }
        
        fetch(`/api/tim-siaga/search-pegawai?keyword=${encodeURIComponent(kw)}`)
            .then(res => res.json())
            .then(result => {
                if (result.data && result.data.length > 0) {
                    if (result.data.length === 1) {
                        addAnggota(result.data[0].nip, result.data[0].nama);
                    } else {
                        let html = '';
                        result.data.forEach(p => {
                            html += `
                                <a href="#" class="list-group-item list-group-item-action py-2 px-3" 
                                   onclick="event.preventDefault(); addAnggota('${p.nip}', '${p.nama}')">
                                    <strong>${p.nama}</strong><br>
                                    <small class="text-muted">${p.nip}</small>
                                </a>`;
                        });
                        searchResults.innerHTML = html;
                        searchResults.style.display = 'block';
                    }
                } else {
                    alert('Pegawai tidak ditemukan!');
                }
            });
    });
    
    // ===================== SAVE =====================
    document.getElementById('btnSave').addEventListener('click', function() {
        const namaTim = document.getElementById('namaTim').value.trim();
        const unitKerjaId = document.getElementById('cmbUnit').value;
        const fungsional = document.getElementById('cmbFungsional').value;
        const periode = document.getElementById('periode').value;
        const shift = document.getElementById('cmbShift').value;
        const noUrut = document.getElementById('noUrut').value;
        const isNew = document.getElementById('isNew').value === 'true';
        
        if (!namaTim) { alert('❌ Nama TIM harus diisi!'); return; }
        if (!unitKerjaId) { alert('❌ Unit Kerja harus dipilih!'); return; }
        if (!fungsional) { alert('❌ Fungsional harus dipilih!'); return; }
        if (!periode) { alert('❌ Periode harus diisi!'); return; }
        if (anggotaTable.length === 0) { alert('❌ Anggota TIM kosong! Silahkan tambah anggota di card Add Anggota TIM.'); return; }
        
        const data = {
            guid_tim: currentGuid,
            nama_tim: namaTim,
            no_urut: noUrut,
            unit_kerja_id: unitKerjaId,
            fungsional: fungsional,
            shift: shift,
            periode: periode,
            anggota: anggotaTable,
            is_new: isNew
        };
        
        console.log('💾 Data yang akan disimpan:', data);
        
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Menyimpan...';
        
        fetch('/api/tim-siaga/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(result => {
            console.log('📋 Hasil save:', result);
            if (result.error) {
                alert('❌ ' + result.error);
            } else {
                alert('✅ ' + (result.message || 'Berhasil!'));
                if (result.guid_tim) {
                    currentGuid = result.guid_tim;
                    document.getElementById('guidTim').value = currentGuid;
                    document.getElementById('isNew').value = 'false';
                }
            }
        })
        .catch(err => {
            console.error('❌ Error:', err);
            alert('Gagal menyimpan!');
        })
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-save me-1"></i>Simpan';
        });
    });
    
    // ===================== DELETE =====================
    document.getElementById('btnDelete').addEventListener('click', function() {
        if (!currentGuid) { alert('❌ Belum ada data yang dipilih! Klik Cari untuk mencari data.'); return; }
        if (!confirm('Yakin hapus data ini?')) return;
        
        fetch('/api/tim-siaga/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({guid_tim: currentGuid})
        })
        .then(res => res.json())
        .then(result => {
            if (result.error) {
                alert('❌ ' + result.error);
            } else {
                alert('✅ ' + (result.message || 'Berhasil dihapus!'));
                clearForm();
            }
        });
    });
    
    // ===================== NEW =====================
    document.getElementById('btnNew').addEventListener('click', function() {
        if (anggotaTable.length > 0 || document.getElementById('namaTim').value) {
            if (!confirm('Data yang belum disimpan akan hilang. Lanjutkan?')) return;
        }
        clearForm();
    });
    
    function clearForm() {
        currentGuid = '';
        document.getElementById('guidTim').value = '';
        document.getElementById('isNew').value = 'true';
        document.getElementById('namaTim').value = '';
        document.getElementById('noUrut').value = '0';
        document.getElementById('cmbFungsional').value = '';
        document.getElementById('cmbShift').value = '';
        document.getElementById('cmbUnit').value = '';
        document.getElementById('lblUpdate').textContent = '';
        anggotaTable = [];
        renderAnggota();
        console.log('🆕 Form dikosongkan');
    }
    
    // ===================== SAVE AS =====================
    document.getElementById('btnSaveAs').addEventListener('click', function() {
        const periodeSumber = document.getElementById('periode').value;
        const periodeTujuan = document.getElementById('periodeTujuan').value;
        const unitKerjaId = document.getElementById('cmbUnit').value;
        const shift = document.getElementById('cmbShift').value;
        
        if (!periodeSumber) { alert('❌ Isi periode sumber terlebih dahulu!'); return; }
        if (!periodeTujuan) { alert('❌ Periode tujuan harus diisi!'); return; }
        if (!unitKerjaId) { alert('❌ Unit Kerja harus dipilih!'); return; }
        
        if (!confirm(`Copy data dari periode ${periodeSumber} ke ${periodeTujuan}?`)) return;
        
        fetch('/api/tim-siaga/save-as', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                periode_sumber: periodeSumber,
                periode_tujuan: periodeTujuan,
                unit_kerja_id: unitKerjaId,
                shift: shift
            })
        })
        .then(res => res.json())
        .then(result => {
            if (result.error) {
                alert('❌ ' + result.error);
            } else {
                alert('✅ ' + (result.message || 'Berhasil!'));
            }
        })
        .catch(err => alert('Gagal!'));
    });
</script>
{% endblock %}
