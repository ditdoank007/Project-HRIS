<!-- pages/dashboard_1/Master File Uang Makan.html -->
{% extends "layout/baseDashboard1.html" %}

{% block title %}- Uang Makan{% endblock %}

{% block content %}
<div class="nxl-content">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Master File</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="{{ url_for('main.view_master_uang_makan') }}">
                        Master Uang Makan
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="card mb-4 filter-card">
                <div class="card-header-custom d-flex justify-content-between align-items-center"
                     style="border-radius:10px;">
                    <h6 class="mb-0">
                        <i class="ti ti-tools-kitchen-2 me-2"></i>
                        <span id="pageTitle">Master Uang Makan</span>
                    </h6>

                    <div class="header-actions">
                        <a href="{{ url_for('main.view_cari_master_uang_makan') }}"
                           class="btn p-0 border-0 bg-transparent shadow-none">
                            <i class="bi bi-search"
                               style="color:#333;font-size:1.1rem;"></i>
                        </a>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold">
                                Tanggal Mulai
                            </label>
                            <div class="col-md-7">
                                <div class="input-group-custom w-100">
                                    <input type="date"
                                           id="inputTglMulai"
                                           class="form-control-sm border w-100">
                                    <span class="icon-append">
                                        <i class="bi bi-calendar3"></i>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold">
                                Jenis Tunjangan
                            </label>
                            <div class="col-md-7">
                                <input type="text"
                                       class="form-control-sm border w-100"
                                       value="U.Makan"
                                       readonly>
                            </div>
                        </div>

                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold">
                                Activity
                            </label>
                            <div class="col-md-7">
                                <input type="text"
                                       class="form-control-sm border w-100"
                                       value="Intern"
                                       readonly>
                            </div>
                        </div>

                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold">
                                Nominal
                            </label>
                            <div class="col-md-7">
                                <div class="input-group-custom w-100">
                                    <input type="number"
                                           id="inputNominal"
                                           class="form-control-sm border w-100 text-end"
                                           min="0"
                                           step="1"
                                           value="0">
                                    <span class="icon-append">
                                        <i class="bi bi-sort-numeric-down"></i>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 d-md-flex align-items-center">
                            <div class="col-md-1"></div>
                            <label class="col-md-2 text-md-start pe-md-4 fw-bold">
                                No Surat
                            </label>
                            <div class="col-md-7">
                                <div class="input-group-custom w-100">
                                    <input type="text"
                                           id="inputNoSurat"
                                           class="form-control-sm border w-100">
                                    <span class="icon-append">
                                        <i class="bi bi-pencil-fill"></i>
                                    </span>
                                </div>
                            </div>
                        </div>

                        <div class="col-12 d-flex justify-content-center mt-3">
                            <button type="button"
                                    id="btnSimpanTunjangan"
                                    class="btn btn-orange-figma px-4">
                                <i class="bi bi-save me-1"></i>
                                <span id="btnText">Simpan</span>
                            </button>

                            <button type="button"
                                    id="btnBatalEdit"
                                    class="btn btn-secondary ms-2 px-4"
                                    style="display:none;">
                                Batal
                            </button>
                        </div>

                        <div class="col-12 text-center">
                            <small id="editInfo" class="text-muted"></small>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const editId = {{ edit_id|default('null')|tojson }};

    const btnSimpan = document.getElementById('btnSimpanTunjangan');
    const btnBatal = document.getElementById('btnBatalEdit');

    const inputTglMulai = document.getElementById('inputTglMulai');
    const inputNominal = document.getElementById('inputNominal');
    const inputNoSurat = document.getElementById('inputNoSurat');

    const pageTitle = document.getElementById('pageTitle');
    const btnText = document.getElementById('btnText');
    const editInfo = document.getElementById('editInfo');

    let currentEditId = editId;

    function clearForm() {
        currentEditId = null;
        inputTglMulai.value = '';
        inputNominal.value = '0';
        inputNoSurat.value = '';

        pageTitle.textContent = 'Master Uang Makan';
        btnText.textContent = 'Simpan';
        editInfo.textContent = '';
        btnBatal.style.display = 'none';

        history.replaceState(
            {},
            '',
            '{{ url_for("main.view_master_uang_makan") }}'
        );
    }

    async function loadEditData(id) {
        try {
            const res = await fetch(
                '/api/uang-makan/detail?id=' +
                encodeURIComponent(id)
            );

            const json = await res.json();

            if (json.status !== 'success') {
                alert(json.message || 'Data tidak ditemukan');
                clearForm();
                return;
            }

            const row = json.data;

            currentEditId = row.tunjangan_id;
            inputTglMulai.value = row.tgl_mulai || '';
            inputNominal.value = row.nominal ?? 0;
            inputNoSurat.value = row.dokreff || '';

            pageTitle.textContent = 'Edit Master Uang Makan';
            btnText.textContent = 'UPDATE';
            btnBatal.style.display = 'inline-block';
            editInfo.textContent =
                'ID Tunjangan: ' + row.tunjangan_id;

        } catch (err) {
            console.error(err);
            alert('Gagal mengambil data untuk Edit.');
            clearForm();
        }
    }

    btnSimpan.addEventListener('click', async function () {
        const tglMulai = inputTglMulai.value;
        const nominal = inputNominal.value;
        const noSurat = inputNoSurat.value.trim();

        if (!tglMulai) {
            alert('Tanggal Mulai wajib diisi');
            return;
        }

        if (nominal === '' || Number(nominal) < 0) {
            alert('Nominal wajib diisi dan tidak boleh negatif');
            return;
        }

        const isEdit = currentEditId !== null &&
                       currentEditId !== undefined;

        const url = isEdit
            ? '/api/uang-makan/update'
            : '/api/uang-makan/save';

        const body = {
            tgl_mulai: tglMulai,
            nominal: nominal,
            no_surat: noSurat
        };

        if (isEdit) {
            body.tunjangan_id = currentEditId;
        }

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            const json = await res.json();

            alert(json.message);

            if (json.status === 'success') {
                clearForm();
            }

        } catch (err) {
            console.error(err);
            alert('Gagal menghubungi server, coba lagi.');
        }
    });

    btnBatal.addEventListener('click', clearForm);

    if (currentEditId !== null &&
        currentEditId !== undefined) {
        loadEditData(currentEditId);
    }
});
</script>
{% endblock %}
