<!-- pages/dashboard_1/Cari User Account.html -->
{% extends "layout/baseDashboard1.html" %}

{% block title %}- User Account{% endblock %}

{% block content %}
<div class="nxl-content">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Master File</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_master_user') }}">User Account</a></li>
                <li class="breadcrumb-item">Cari User</li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="card mb-4 shadow-sm" style="border-radius: 10px; overflow: hidden; border: none;">
                <div class="card-header-custom d-flex justify-content-between align-items-center p-3"
                    style="background: #ffffff; border-bottom: 1px solid #eee;">
                    <h6 class="mb-0"><i class="bi bi-search me-2"></i> Cari User</h6>
                    <a href="{{ url_for('main.view_master_user') }}" class="btn-close-custom">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>

                <div class="card-body p-4">
                    <div class="row mb-4 align-items-center">
                        <div
                            class="col-md-12 d-flex flex-column flex-md-row align-items-start align-items-md-center flex-wrap gap-2">
                            <label class="filter-label-wide">Filter</label>

                            <select class="form-select-sm border custom-select w-mobile-100" id="filterField1">
                                <option value="">- Pilih Field -</option>
                                <option value="Gol">Gol</option>
                                <option value="Jabatan">Jabatan</option>
                                <option value="Jenis Kelamin">Jenis Kelamin</option>
                                <option value="Nama Peg">Nama Peg</option>
                                <option value="NIP">NIP</option>
                                <option value="No Finger">No Finger</option>
                                <option value="Unit Kerja">Unit Kerja</option>
                            </select>

                            <div class="input-group-custom w-mobile-100">
                                <input type="text" class="form-control-sm border" id="filterKeyword1">
                                <span class="icon-append"><i class="bi bi-pencil-fill"></i></span>
                            </div>

                            <span class="mx-md-2 fw-bold text-dan">Dan</span>

                            <select class="form-select-sm border custom-select w-mobile-100" id="filterField2">
                                <option value="">- Pilih Field -</option>
                                <option value="Gol">Gol</option>
                                <option value="Jabatan">Jabatan</option>
                                <option value="Jenis Kelamin">Jenis Kelamin</option>
                                <option value="Nama Peg">Nama Peg</option>
                                <option value="NIP">NIP</option>
                                <option value="No Finger">No Finger</option>
                                <option value="Unit Kerja">Unit Kerja</option>
                            </select>

                            <div class="input-group-custom w-mobile-100">
                                <input type="text" class="form-control-sm border" id="filterKeyword2">
                                <span class="icon-append"><i class="bi bi-pencil-fill"></i></span>
                            </div>

                            <button class="btn-refresh-custom ms-md-auto mt-2 mt-md-0 w-mobile-100" id="btnRefreshUser">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                        <p class="mb-1 fw-semibold text-dark" style="font-size: 12px;">
                            ㅤ
                        </p>
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle">
                                <thead style="background:#EB6831;">
                                    <tr>
                                        <th style="color:white; vertical-align: middle;">No</th>
                                        <th style="color:white; vertical-align: middle;">NIP</th>
                                        <th style="color:white; vertical-align: middle;">Nama</th>
                                        <th style="color:white; vertical-align: middle;">Jabatan</th>
                                        <th style="color:white; vertical-align: middle;">Level</th>
                                        <th style="color:white; vertical-align: middle;">UpdateBy</th>
                                        <th style="color:white; vertical-align: middle;">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="userAccountTableBody">
                                    <tr>
                                        <td colspan="7" style="vertical-align: middle; padding: 20px;">No records to
                                            display.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const tbody = document.getElementById('userAccountTableBody');

    function buildQueryParams() {
        const params = new URLSearchParams();
        const field1 = document.getElementById('filterField1').value;
        const keyword1 = document.getElementById('filterKeyword1').value.trim();
        const field2 = document.getElementById('filterField2').value;
        const keyword2 = document.getElementById('filterKeyword2').value.trim();

        if (field1 && keyword1) {
            params.append('field1', field1);
            params.append('keyword1', keyword1);
        }
        if (field2 && keyword2) {
            params.append('field2', field2);
            params.append('keyword2', keyword2);
        }
        return params;
    }

    async function loadUserAccount() {
        const params = buildQueryParams();
        try {
            const res = await fetch('/api/user-account/list?' + params.toString());
            const json = await res.json();

            if (json.status !== 'success') {
                alert(json.message || 'Gagal mengambil data');
                return;
            }

            renderTable(json.data);
        } catch (err) {
            alert('Gagal menghubungi server, coba lagi.');
            console.error(err);
        }
    }

    function renderTable(data) {
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="padding:20px;">No records to display.</td></tr>';
            return;
        }

        data.forEach(row => {
            tbody.innerHTML += `
                <tr>
                    <td class="text-center">${row.no}</td>
                    <td class="text-center">${row.user_id}</td>
                    <td class="text-start">${row.nama}</td>
                    <td class="text-start">${row.jabatan}</td>
                    <td class="text-center">${row.level}</td>
                    <td class="text-center">${row.update_by}</td>
                    <td style="white-space: nowrap;">
                        <button
                            type="button"
                            class="btn btn-sm btn-warning me-1"
                            onclick="editUserAccount('${row.user_id}')"
                            title="Edit User Account">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            onclick="deleteUserAccount('${row.user_id}', '${row.nama.replace(/'/g, "\\'")}')"
                            title="Hapus User Account">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    window.editUserAccount = function (nip) {
        if (!nip) {
            alert('NIP tidak tersedia.');
            return;
        }

        window.location.href = '/master/user?nip=' + encodeURIComponent(nip);
    };

    window.deleteUserAccount = async function (nip, nama) {
        if (!nip) {
            alert('NIP tidak tersedia.');
            return;
        }

        const displayName = nama || nip;

        const confirmed = confirm(
            'Hapus User Account HRIS untuk:\n\n' +
            displayName +
            '\nNIP: ' + nip +
            '\n\nAccount dan seluruh hak akses HRIS akan dihapus.\n' +
            'Data PEGAWAI tidak akan dihapus.\n\nLanjutkan?'
        );

        if (!confirmed) {
            return;
        }

        try {
            const res = await fetch('/api/user-account/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nip: nip
                })
            });

            const json = await res.json();

            if (!res.ok || json.status !== 'success') {
                alert(json.message || 'Gagal menghapus User Account.');
                return;
            }

            alert(json.message || 'User Account berhasil dihapus.');

            await loadUserAccount();

        } catch (err) {
            console.error(err);
            alert('Gagal menghubungi server, coba lagi.');
        }
    };

    document.getElementById('btnRefreshUser').addEventListener('click', loadUserAccount);

    // Load data pertama kali saat halaman dibuka
    loadUserAccount();
});
</script>
{% endblock %}
