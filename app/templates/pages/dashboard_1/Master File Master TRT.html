<!-- pages/dashboard_1/Master File Master TRT.html -->
{% extends "layout/baseHRIS.html" %}

{% block title %}- TRT{% endblock %}

{% block header_kicker %}MASTER FILE{% endblock %}
{% block header_title %}Master TRT{% endblock %}

{% block content %}
<div class="hris-page">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Master File</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_master_trt') }}">Master TRT</a></li>
            </ul>
        </div>
    </div>

    <div class="main-content master-siaga">
        <div class="container-fluid">
            <div class="hris-card">
                <div class="hris-card-header"
                    style="border-radius: 10px;">
                    <h6 class="mb-0">
                        <i class="ti ti-cash me-2"></i> Master TRT
                    </h6>

                    <div class="header-actions">
                        <button class="hris-btn hris-btn-ghost hris-btn-icon d-md-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#headerIconsCollapse">
                            <i class="bi bi-three-dots-vertical" style="font-size: 1.5rem; color: #333;"></i>
                        </button>

                        <div class="collapse d-md-flex align-items-center" id="headerIconsCollapse">
                            <div class="header-icons-wrapper d-flex gap-3 p-2 p-md-0 mt-2 mt-md-0">
                                <a href="#" class="hris-btn hris-btn-ghost hris-btn-icon text-decoration-none">
                                    <i class="bi bi-search" style="color: #333; font-size: 1.1rem;"></i>
                                </a>

                                <button class="hris-btn hris-btn-ghost hris-btn-icon">
                                    <i class="bi bi-file-earmark-plus" style="color: #0d6efd; font-size: 1.2rem;"></i>
                                </button>
                                <button class="hris-btn hris-btn-ghost hris-btn-icon">
                                    <i class="bi bi-save" style="color: #198754; font-size: 1.2rem;"></i>
                                </button>

                                <button class="hris-btn hris-btn-ghost hris-btn-icon">
                                    <i class="bi bi-trash" style="color: #dc3545; font-size: 1.2rem;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="hris-card-body">
                    <div class="hris-form-stack">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}

{% endblock %}
