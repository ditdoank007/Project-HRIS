<!-- pages/dashboard_1/Master File Master User.html -->
{% extends "layout/baseDashboard1.html" %}

{% block title %}- User Account{% endblock %}

{% block content %}
<div class="nxl-content">
    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Master File</h5>
            </div>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('main.view_master_user') }}">User Account</a></li>
            </ul>
        </div>
    </div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="card mb-4 shadow-sm" style="border-radius: 10px; overflow: hidden; border: none;">
                <div class="card-header-custom d-flex justify-content-between align-items-center"
                    style="border-radius: 10px;">
                    <h6 class="mb-0">
                        <i class="ti ti-calendar-plus me-2"></i> Master User HRIS
                    </h6>

                    <div class="header-actions">
                        <button class="btn p-0 border-0 bg-transparent shadow-none d-md-none" type="button"
                            data-bs-toggle="collapse" data-bs-target="#headerIconsCollapse">
                            <i class="bi bi-three-dots-vertical" style="font-size: 1.5rem; color: #333;"></i>
                        </button>

                        <div class="collapse d-md-flex align-items-center" id="headerIconsCollapse">
                            <div class="header-icons-wrapper d-flex gap-3 p-2 p-md-0 mt-2 mt-md-0">
                                <a href="{{ url_for('main.view_cari_user_account') }}"
                                    class="btn p-0 border-0 bg-transparent shadow-none text-decoration-none">
                                    <i class="bi bi-search" style="color: #333; font-size: 1.1rem;"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <div class="row mb-4 align-items-center">
                        <label class="col-md-2 fw-bold text-dark">Cari Pegawai</label>
                        <div class="col-md-10">
                            <div class="input-group" style="max-width: 500px;">
                                <input
                                    type="text"
                                    class="form-control bg-white"
                                    placeholder="Ketik nama pegawai..."
                                    id="inputNamaPegawai"
                                    autocomplete="off">

                                <span class="input-group-text bg-light">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                            </div>

                            <div id="pegawaiSuggestion"
                                 class="list-group position-absolute"
                                 style="z-index:999; max-width:500px;">
                            </div>

                            <input type="hidden" id="inputNip">
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label class="col-md-2 fw-bold text-dark">Nama</label>
                        <div class="col-md-10">
                            <div class="border-bottom py-2 text-primary" style="min-height: 38px;" id="displayNama">-</div>
                        </div>
                    </div>

                    <div class="row mb-4 align-items-center">
                        <label class="col-md-2 fw-bold text-dark">Level</label>
                        <div class="col-md-4">
                            <div class="input-group">
                                <select class="form-select" id="selectLevel">
                                    <option value="operator">Operator</option>
                                    <option value="admin">Admin</option>
                                </select>
                                <span class="input-group-text bg-light"><i class="bi bi-diagram-3 text-muted"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <label class="col-md-2 fw-bold text-dark">Hak Akses Menu</label>
                        <div class="col-md-10">
                            <div class="table-responsive border" style="border-radius: 5px;">
                                <div class="table-responsive">
                                    <table class="table table-bordered table-striped text-center align-middle">
                                        <thead style="background:#EB6831;">
                                            <tr>
                                                <th style="color:white; vertical-align: middle;">Nama</th>
                                                <th style="color:white; vertical-align: middle;">Type</th>
                                                <th style="color:white; vertical-align: middle;">Isi Akses</th>
                                                <th style="color:white; vertical-align: middle;">Type Akses</th>
                                            </tr>
                                        </thead>
                                        <tbody id="operatorFormsTableBody">
                                            <tr>
                                                <td colspan="4" style="vertical-align: middle; padding: 20px;">
                                                    Cari pegawai terlebih dahulu.</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tombol aksi form -->
                    <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                        <button
                            type="button"
                            id="btnBatalUser"
                            class="btn btn-secondary px-4"
                            style="min-width: 110px;">
                            <i class="bi bi-x-circle me-1"></i>BATAL
                        </button>

                        <button
                            type="button"
                            id="btnSimpanUser"
                            class="btn text-white px-4"
                            style="background-color:#e66b30; min-width:110px;">
                            <i class="bi bi-save me-1"></i>SIMPAN
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const inputNip = document.getElementById('inputNip');
    const inputNamaPegawai = document.getElementById('inputNamaPegawai');
    const pegawaiSuggestion = document.getElementById('pegawaiSuggestion');
    const btnRefresh = document.getElementById('btnRefreshUser');
    const btnBatal = document.getElementById('btnBatalUser');
    const btnSimpan = document.getElementById('btnSimpanUser');
    const displayNama = document.getElementById('displayNama');
    const selectLevel = document.getElementById('selectLevel');
    const tbodyForms = document.getElementById('operatorFormsTableBody');


    // =====================================================
    // AUTOCOMPLETE PEGAWAI - MASTER USER ACCOUNT
    // =====================================================
    let autocompleteTimer = null;

    inputNamaPegawai.addEventListener('input', function () {
        const keyword = this.value.trim();

        inputNip.value = '';
        displayNama.textContent = '-';

        if (autocompleteTimer) {
            clearTimeout(autocompleteTimer);
        }

        if (keyword.length < 1) {
            pegawaiSuggestion.innerHTML = '';
            return;
        }

        autocompleteTimer = setTimeout(async () => {
            try {
                const res = await fetch(
                    `/api/search_pegawai?keyword=${encodeURIComponent(keyword)}`
                );

                const json = await res.json();

                pegawaiSuggestion.innerHTML = '';

                if (!json.data || json.data.length === 0) {
                    return;
                }

                json.data.forEach(p => {
                    const item = document.createElement('button');

                    item.type = 'button';
                    item.className = 'list-group-item list-group-item-action';

                    item.innerHTML = `
                        <strong>${p.nama}</strong>
                        <small class="text-muted">
                            (${p.nip})
                        </small>
                    `;

                    item.addEventListener('click', function () {

                        inputNamaPegawai.value = p.nama;
                        inputNip.value = p.nip;

                        pegawaiSuggestion.innerHTML = '';

                        loadUserAccount();
                    });

                    pegawaiSuggestion.appendChild(item);
                });

            } catch (err) {
                console.error(
                    'Autocomplete pegawai error:',
                    err
                );
            }

        }, 300);
    });


    document.addEventListener('click', function(e) {

        if (
            !e.target.closest('#inputNamaPegawai') &&
            !e.target.closest('#pegawaiSuggestion')
        ) {
            pegawaiSuggestion.innerHTML = '';
        }

    });


    function renderOperatorForms(forms) {
        if (!forms || forms.length === 0) {
            tbodyForms.innerHTML = `<tr><td colspan="4" style="padding:20px;">No records to display.</td></tr>`;
            return;
        }

        tbodyForms.innerHTML = forms.map(form => `
            <tr>
                <td class="text-start">${form.form_name}</td>
                <td>${form.form_type}</td>
                <td>
                    <input type="checkbox"
                           class="akses-checkbox"
                           data-form-id="${form.form_id}"
                           ${form.is_akses ? 'checked' : ''}>
                </td>
                <td>
                    <select class="form-select form-select-sm type-akses-select" data-form-id="${form.form_id}">
                        <option value="M" ${form.type_akses === 'M' ? 'selected' : ''}>Modify</option>
                        <option value="R" ${form.type_akses === 'R' ? 'selected' : ''}>Read Only</option>
                    </select>
                </td>
            </tr>
        `).join('');
    }

    async function loadUserAccount() {
        const nip = inputNip.value.trim();
        if (!nip) {
            alert('NIP kosong');
            return;
        }

        try {
            const res = await fetch(`/api/user-account/detail?nip=${encodeURIComponent(nip)}`);
            const json = await res.json();

            if (json.status !== 'success') {
                alert(json.message || 'Pegawai tidak ditemukan');
                displayNama.textContent = '-';
                renderOperatorForms([]);
                return;
            }

            displayNama.textContent = json.data.nama;
            selectLevel.value = json.data.init_level === 0 ? 'admin' : 'operator';
            renderOperatorForms(json.data.operator_forms);

        } catch (err) {
            console.error('Gagal memuat data user account:', err);
            alert('Terjadi kesalahan jaringan');
        }
    }

    function collectAksesList() {
        // Hanya ambil form yang checkbox-nya DICENTANG -- form yang
        // tidak dicentang tidak dikirim sama sekali (sesuai logic
        // delete-then-insert di backend)
        const checkedBoxes = tbodyForms.querySelectorAll('.akses-checkbox:checked');
        return Array.from(checkedBoxes).map(checkbox => {
            const formId = checkbox.dataset.formId;
            const select = tbodyForms.querySelector(`.type-akses-select[data-form-id="${formId}"]`);
            return {
                form_id: formId,
                type_akses: select ? select.value : 'M',
            };
        });
    }

    async function saveUserAccount() {
        const nip = inputNip.value.trim();
        if (!nip) {
            alert('NIP wajib diisi');
            return;
        }

        const payload = {
            nip: nip,
            level: selectLevel.value,
            akses_list: collectAksesList(),
        };

        btnSimpan.disabled = true;

        try {
            const res = await fetch('/api/user-account/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const json = await res.json();

            if (json.status !== 'success') {
                alert(json.message || 'Gagal menyimpan data user account');
                return;
            }

            alert('Berhasil disimpan !');
            loadUserAccount(); // refresh tampilan supaya sinkron dengan DB

        } catch (err) {
            console.error('Gagal menyimpan user account:', err);
            alert('Terjadi kesalahan jaringan');
        } finally {
            btnSimpan.disabled = false;
        }
    }

    btnBatal.addEventListener('click', function () {
        window.history.back();
    });

    if (btnRefresh) {
        btnRefresh.addEventListener('click', loadUserAccount);
    }

    btnSimpan.addEventListener('click', saveUserAccount);

    // Jika halaman dibuka dari tombol Edit pada daftar User Account,
    // otomatis isi NIP dan load data account.
    const urlParams = new URLSearchParams(window.location.search);
    const editNip = urlParams.get('nip');

    if (editNip) {
        inputNip.value = editNip;
        loadUserAccount();
    }
});
</script>
{% endblock %}
